name: Probe DTM archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_dtm.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_dtm.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_dtm.json
          git diff --cached --quiet || git commit -m "probe: DTM archive $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push && break
            sleep 7
          done
