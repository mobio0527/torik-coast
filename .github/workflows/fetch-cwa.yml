name: Fetch CWA data

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour (UTC); GitHub may start scheduled runs late
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_cwa.py"
      - ".github/workflows/fetch-cwa.yml"

permissions:
  contents: write

concurrency:
  group: fetch-cwa
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
        run: python3 scripts/fetch_cwa.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "data: CWA update $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push && break
              sleep 7
            done
          fi
