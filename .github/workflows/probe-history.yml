name: Probe history sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_history.py"
permissions:
  contents: write
concurrency:
  group: probe-history
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
        run: python3 scripts/probe_history.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_history.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "probe: history sources $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push && break
              sleep 7
            done
          fi
